<!doctype html>
<html lang="es">
  <head>
    <!-- Esta etiqueta declara el uso de HTML5. -->
    <meta charset="UTF-8" />
    <!-- Esta etiqueta permite mostrar correctamente caracteres especiales. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Esta etiqueta hace que la página se adapte a celulares y computadoras. -->
    <meta
      name="description"
      content="Página no encontrada en el sitio de Eco Vida."
    />
    <!-- Esta etiqueta describe el contenido de esta página de error. -->
    <meta
      name="keywords"
      content="Eco Vida, página no encontrada, error 404"
    />
    <!-- Esta etiqueta reúne palabras clave básicas relacionadas con esta página. -->
    <meta name="author" content="Eco Vida" />
    <!-- Esta etiqueta indica el autor o nombre del proyecto. -->
    <meta name="theme-color" content="#235b35" />
    <!-- Esta etiqueta define el color principal que algunos navegadores móviles pueden usar. -->

    <meta property="og:type" content="website" />
    <!-- Esta etiqueta indica a redes sociales que la página es un sitio web. -->
    <meta property="og:title" content="Página no encontrada - Eco Vida" />
    <!-- Esta etiqueta muestra el título de la página al compartirla en redes. -->
    <meta
      property="og:description"
      content="Página no encontrada en el sitio de Eco Vida."
    />
    <!-- Esta etiqueta muestra la descripción al compartir el enlace. -->
    <meta property="og:locale" content="es_CR" />
    <!-- Esta etiqueta indica el idioma y la región del contenido. -->
    <meta property="og:url" content="https://ecovidaservicios.netlify.app/404.html" />
    <!-- Esta etiqueta indica la URL canónica de la página. -->
    <meta
      property="og:image"
      content="https://ecovidaservicios.netlify.app/img/eco_vida_logo_01.jpeg"
    />
    <!-- Esta etiqueta indica la imagen que se mostrará al compartir el enlace. -->
    <meta property="og:image:alt" content="Logo de Eco Vida" />
    <!-- Esta etiqueta describe la imagen para accesibilidad. -->
    <meta name="twitter:card" content="summary" />
    <!-- Esta etiqueta mejora la vista previa del enlace en Twitter. -->

    <title>Página no encontrada - Eco Vida</title>
    <!-- Este título aparece en la pestaña del navegador. -->
    <link rel="icon" href="favicon.ico" />
    <!-- Este enlace usa el favicon optimizado de la pestaña del navegador. -->

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
      crossorigin="anonymous"
    />
    <!-- Este enlace carga Bootstrap desde internet. -->

    <link rel="stylesheet" href="css/style.css" />
    <!-- Este enlace carga los estilos personalizados del proyecto. -->
  </head>
  <body>
    <div data-include="partials/header.html"></div>
    <!-- Este contenedor es llenado por components.js con el encabezado compartido. -->

    <main id="contenido-principal" class="container my-5">
      <section class="text-center caja-cotizacion p-4 p-md-5">
        <!-- Esta sección muestra el contenido de la página 404. -->
        <h1 class="mb-3">Página no encontrada</h1>
        <!-- Este título explica que la ruta solicitada no existe. -->
        <p class="mb-4">
          La página que buscas no está disponible. Puedes volver al inicio o
          revisar nuestros servicios.
        </p>
        <!-- Este párrafo orienta al visitante hacia páginas útiles. -->
        <a href="index.html" class="btn btn-success mb-2">Volver al inicio</a>
        <!-- Este botón lleva al usuario a la página principal. -->
        <a href="servicios.html" class="btn btn-outline-success mb-2"
          >Ver servicios</a
        >
        <!-- Este botón lleva al usuario a la página de servicios. -->
      </section>
    </main>

    <div data-include="partials/footer.html"></div>
    <!-- Este contenedor es llenado por components.js con el pie de página compartido. -->

    <script
      src="https://code.jquery.com/jquery-3.7.1.js"
      integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4="
      crossorigin="anonymous"
    ></script>
    <!-- Este script carga la librería jQuery desde internet. -->

    <script
      src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js"
      integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
      crossorigin="anonymous"
    ></script>
    <!-- Este script carga Popper, requerido por Bootstrap. -->

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js"
      integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
      crossorigin="anonymous"
    ></script>
    <!-- Este script carga los componentes interactivos de Bootstrap. -->

    <script src="js/components.js"></script>
    <!-- Este script carga el encabezado y el pie desde la carpeta partials. -->

    <script src="js/script.js"></script>
    <!-- Este script carga el JavaScript propio del proyecto. -->
  </body>
</html>
