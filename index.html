<!doctype html>
<html lang="es">
  <head>
    <!-- Esta etiqueta indica el tipo de documento HTML5. -->
    <meta charset="UTF-8" />
    <!-- Esta etiqueta permite mostrar tildes, eñes y caracteres especiales correctamente. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Esta etiqueta adapta el diseño al ancho de la pantalla del dispositivo. -->
    <meta
      name="description"
      content="Eco Vida ofrece servicios de jardinería, mantenimiento de zonas verdes y paisajismo para espacios exteriores."
    />
    <!-- Esta etiqueta describe el contenido de la página para buscadores y redes sociales. -->
    <meta
      name="keywords"
      content="Eco Vida, jardinería, paisajismo, mantenimiento de jardines, zonas verdes"
    />
    <!-- Esta etiqueta reúne palabras clave básicas relacionadas con el sitio. -->
    <meta name="author" content="Eco Vida" />
    <!-- Esta etiqueta indica el autor o nombre del proyecto. -->
    <meta name="theme-color" content="#235b35" />
    <!-- Esta etiqueta define el color principal que algunos navegadores móviles pueden usar. -->

    <meta property="og:type" content="website" />
    <!-- Esta etiqueta indica a redes sociales que la página es un sitio web. -->
    <meta property="og:title" content="Inicio - Eco Vida" />
    <!-- Esta etiqueta muestra el título de la página al compartirla en redes. -->
    <meta
      property="og:description"
      content="Eco Vida ofrece servicios de jardinería, mantenimiento de zonas verdes y paisajismo para espacios exteriores."
    />
    <!-- Esta etiqueta muestra la descripción al compartir el enlace. -->
    <meta property="og:locale" content="es_CR" />
    <!-- Esta etiqueta indica el idioma y la región del contenido. -->
    <meta property="og:url" content="https://ecovidaservicios.netlify.app/" />
    <!-- Esta etiqueta indica la URL canónica de la página. -->
    <meta
      property="og:image"
      content="https://ecovidaservicios.netlify.app/img/eco_vida_logo_01.jpeg"
    />
    <!-- Esta etiqueta indica la imagen que se mostrará al compartir el enlace. -->
    <meta property="og:image:alt" content="Logo de Eco Vida" />
    <!-- Esta etiqueta describe la imagen para accesibilidad. -->
    <meta name="twitter:card" content="summary" />
    <!-- Esta etiqueta mejora la vista previa del enlace en Twitter. -->

    <title>Inicio - Eco Vida</title>
    <!-- Este título aparece en la pestaña del navegador. -->
    <link rel="icon" href="favicon.ico" />
    <!-- Este enlace usa el favicon optimizado de la pestaña del navegador. -->

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
      crossorigin="anonymous"
    />
    <!-- Este enlace carga los estilos de Bootstrap desde internet. -->

    <link rel="stylesheet" href="css/style.css" />
    <!-- Este enlace carga los estilos personalizados del proyecto. -->
  </head>
  <body>
    <div data-include="partials/header.html"></div>
    <!-- Este contenedor es llenado por components.js con el encabezado compartido. -->

    <header class="encabezado-principal">
      <!-- Este encabezado presenta el tema principal de la página. -->
      <div class="container text-center py-5">
        <!-- Esta imagen muestra el logo principal de Eco Vida en la portada. -->
        <img
          src="img/eco_vida_logo_01.jpeg"
          alt="Logo de Eco Vida"
          class="logo-encabezado mb-4"
        />
        <!-- Esta clase permite controlar el tamaño del logo desde CSS. -->
        <!-- Este contenedor centra el texto y agrega espacio vertical. -->
        <h1 class="mb-3">Bienvenido a Eco Vida</h1>
        <!-- Este título principal resume el sitio. -->

        <a href="servicios.html" class="btn btn-success btn-lg"
          >Ver nuestros servicios</a
        >
        <!-- Este botón dirige al usuario hacia la página de servicios. -->
      </div>
    </header>

    <main id="contenido-principal" class="container my-5">
      <section class="mb-5">
        <!-- Esta sección contiene la pasarela de imágenes solicitada. -->

        <div id="carruselJardin" class="carousel slide" data-ride="carousel">
          <!-- Este bloque crea un carrusel de Bootstrap. -->
          <ol class="carousel-indicators">
            <!-- Estos indicadores permiten cambiar de imagen manualmente. -->
            <li
              data-target="#carruselJardin"
              data-slide-to="0"
              class="active"
            ></li>
            <!-- Este indicador representa la primera imagen. -->
            <li data-target="#carruselJardin" data-slide-to="1"></li>
            <!-- Este indicador representa la segunda imagen. -->
            <li data-target="#carruselJardin" data-slide-to="2"></li>
            <!-- Este indicador representa la tercera imagen. -->
          </ol>

          <div class="carousel-inner rounded sombra-suave">
            <!-- Este contenedor guarda todas las imágenes del carrusel. -->
            <div class="carousel-item active">
              <!-- Esta es la primera diapositiva y por eso empieza activa. -->
              <img
                src="img/jardineria_08.jpeg"
                class="d-block w-100 imagen-carrusel"
                alt="Diseño de jardín con plantas decorativas"
              />
              <!-- Esta imagen se muestra ocupando todo el ancho del carrusel. -->
            </div>

            <div class="carousel-item">
              <!-- Esta es la segunda diapositiva del carrusel. -->
              <img
                src="img/jardineria_07.jpeg"
                class="d-block w-100 imagen-carrusel"
                alt="Mantenimiento de jardín con poda especializada"
              />
              <!-- Esta imagen muestra otro trabajo del proyecto. -->
            </div>

            <div class="carousel-item">
              <!-- Esta es la tercera diapositiva del carrusel. -->
              <img
                src="img/jardineria_15.webp"
                class="d-block w-100 imagen-carrusel"
                alt="Sistema de riego instalado en zona verde"
              />
              <!-- Esta imagen presenta un sistema de riego. -->
            </div>
          </div>

          <a
            class="carousel-control-prev"
            href="#carruselJardin"
            role="button"
            data-slide="prev"
          >
            <!-- Este control permite ir a la imagen anterior. -->
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <!-- Este icono representa la flecha izquierda. -->
            <span class="sr-only">Anterior</span>
            <!-- Este texto es útil para accesibilidad. -->
          </a>

          <a
            class="carousel-control-next"
            href="#carruselJardin"
            role="button"
            data-slide="next"
          >
            <!-- Este control permite ir a la imagen siguiente. -->
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <!-- Este icono representa la flecha derecha. -->
            <span class="sr-only">Siguiente</span>
            <!-- Este texto es útil para accesibilidad. -->
          </a>
        </div>
      </section>

      <section class="text-center">
        <!-- Esta sección invita al usuario a seguir navegando. -->
        <h2 class="mb-3">Estamos para servirle</h2>
        <!-- Este título refuerza la presentación del sitio. -->
        <p class="mb-4">
          Si desea conocer más detalles, contáctenos para una atención
          personalizada.
        </p>
        <!-- Este párrafo motiva al usuario a recorrer el sitio. -->
        <a href="contacto.html" class="btn btn-outline-success"
          >Ir a contacto</a
        >
        <!-- Este botón dirige al usuario hacia la página de contacto. -->
      </section>
    </main>

    <div data-include="partials/footer.html"></div>
    <!-- Este contenedor es llenado por components.js con el pie de página compartido. -->

    <script
      src="https://code.jquery.com/jquery-3.7.1.js"
      integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4="
      crossorigin="anonymous"
    ></script>
    <!-- Este script carga la librería jQuery. -->

    <script
      src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js"
      integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
      crossorigin="anonymous"
    ></script>
    <!-- Este script carga Popper, que Bootstrap necesita para algunos componentes. -->

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js"
      integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
      crossorigin="anonymous"
    ></script>
    <!-- Este script carga los componentes interactivos de Bootstrap. -->

    <script src="js/components.js"></script>
    <!-- Este script carga el encabezado y el pie desde la carpeta partials. -->

    <script src="js/script.js"></script>
    <!-- Este script carga el archivo JavaScript del proyecto. -->
  </body>
</html>
